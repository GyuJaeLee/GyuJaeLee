<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sky Fighter</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 20%, #10233f 0%, #060d1c 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif; overflow: hidden;
  }
  #wrap {
    position: relative;
    border-radius: 14px;
    padding: 3px;
    background: linear-gradient(135deg, #3af, #0a1a3f, #f5a623);
    box-shadow: 0 0 50px rgba(51,170,255,0.35), 0 10px 40px rgba(0,0,0,0.6);
  }
  canvas {
    background: linear-gradient(#0a1a3f, #1c3d6b);
    display: block;
    border-radius: 12px;
  }
  #hud {
    position: absolute; top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-family: inherit;
  }
  #scoreBox {
    color: #cff; font-size: 15px; letter-spacing: 1px;
    background: rgba(6, 16, 32, 0.55); border: 1px solid rgba(102,204,255,0.4);
    border-radius: 8px; padding: 6px 12px; backdrop-filter: blur(2px);
  }
  #scoreBox .label { opacity: 0.65; font-size: 11px; text-transform: uppercase; margin-right: 4px; }
  #scoreBox .value { font-weight: bold; font-size: 18px; color: #fff; text-shadow: 0 0 8px #3af; }
  #livesBox {
    display: flex; gap: 4px;
    background: rgba(6, 16, 32, 0.55); border: 1px solid rgba(255,102,102,0.4);
    border-radius: 8px; padding: 8px 12px;
  }
  .heart {
    width: 16px; height: 16px; position: relative; transform: rotate(-45deg);
    background: #f55; filter: drop-shadow(0 0 4px #f55);
  }
  .heart::before, .heart::after {
    content: ''; position: absolute; width: 16px; height: 16px; background: #f55; border-radius: 50%;
  }
  .heart::before { top: -8px; left: 0; }
  .heart::after { top: 0; left: 8px; }
  .heart.empty { background: rgba(255,255,255,0.12); filter: none; }
  .heart.empty::before, .heart.empty::after { background: rgba(255,255,255,0.12); }
  #flash {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,60,60,0.35); border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out;
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; border-radius: 12px;
    background: radial-gradient(circle at 50% 40%, rgba(20,45,80,0.9), rgba(2,8,20,0.95));
    backdrop-filter: blur(1px);
  }
  #overlay h1 {
    font-size: 44px; margin: 0 0 6px; letter-spacing: 4px;
    color: #7fd3ff; text-shadow: 0 0 12px #3af, 0 0 30px rgba(51,170,255,0.6);
    animation: pulseGlow 2.2s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { text-shadow: 0 0 12px #3af, 0 0 30px rgba(51,170,255,0.6); }
    50% { text-shadow: 0 0 20px #6cf, 0 0 50px rgba(102,204,255,0.9); }
  }
  #overlay .subtitle { color: #f5a623; letter-spacing: 2px; font-size: 12px; margin-bottom: 18px; text-transform: uppercase; }
  #overlay .instructions {
    display: flex; gap: 22px; margin: 10px 0 6px; font-size: 13px; color: #9fc6e8;
  }
  #overlay .instructions div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #overlay kbd {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(102,204,255,0.5);
    border-radius: 5px; padding: 3px 8px; font-size: 12px; color: #cff;
  }
  #overlay p.hint { margin: 10px 0 0; font-size: 13px; color: #8fb3d1; }
  #overlay .score-line { font-size: 22px; color: #f5a623; margin: 6px 0 2px; text-shadow: 0 0 10px rgba(245,166,35,0.6); }
  #overlay button {
    margin-top: 22px; padding: 12px 30px; font-size: 16px; cursor: pointer;
    letter-spacing: 1px; font-weight: bold;
    background: linear-gradient(135deg, #1c3d6b, #123); color: #cff;
    border: 2px solid #3af; border-radius: 8px;
    box-shadow: 0 0 14px rgba(51,170,255,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }
  #overlay button:hover {
    background: linear-gradient(135deg, #2a5488, #1c3d6b);
    box-shadow: 0 0 22px rgba(51,170,255,0.6);
    transform: translateY(-2px);
  }
  #overlay button:active { transform: translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="flash"></div>
  <div id="hud">
    <div id="scoreBox"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div id="livesBox"></div>
  </div>
  <div id="overlay">
    <div class="subtitle">Arcade Dogfight</div>
    <h1>SKY FIGHTER</h1>
    <div class="instructions">
      <div><kbd>&#8592;&#8593;&#8595;&#8594;</kbd> / <kbd>WASD</kbd> Move</div>
      <div><kbd>SPACE</kbd> Shoot</div>
    </div>
    <p class="hint">Destroy enemy planes. Avoid collisions.</p>
    <button id="startBtn">Start Game</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById('score');
const livesBox = document.getElementById('livesBox');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const flashEl = document.getElementById('flash');

const MAX_LIVES = 3;
function renderLives() {
  livesBox.innerHTML = '';
  for (let i = 0; i < MAX_LIVES; i++) {
    const h = document.createElement('div');
    h.className = 'heart' + (i < lives ? '' : ' empty');
    livesBox.appendChild(h);
  }
}
function flashHit() {
  flashEl.style.opacity = '1';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 150);
}

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

class Player {
  constructor() {
    this.w = 40; this.h = 40;
    this.x = W / 2 - this.w / 2; this.y = H - 80;
    this.speed = 5;
    this.cooldown = 0;
  }
  update() {
    if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
    if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
    if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
    if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;
    this.x = Math.max(0, Math.min(W - this.w, this.x));
    this.y = Math.max(0, Math.min(H - this.h, this.y));
    if (this.cooldown > 0) this.cooldown--;
    if (keys['Space'] && this.cooldown === 0) {
      bullets.push(new Bullet(this.x + this.w / 2 - 2, this.y, -8, '#6cf'));
      this.cooldown = 10;
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
    ctx.fillStyle = '#6cf';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(14, 18);
    ctx.lineTo(0, 10);
    ctx.lineTo(-14, 18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#39c';
    ctx.fillRect(-20, 2, 40, 6);
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, vy, color) {
    this.x = x; this.y = y; this.w = 4; this.h = 10; this.vy = vy; this.color = color;
  }
  update() { this.y += this.vy; }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
  }
}

class Enemy {
  constructor() {
    this.w = 34; this.h = 34;
    this.x = Math.random() * (W - this.w);
    this.y = -this.h;
    this.speed = 1.5 + Math.random() * 2;
    this.fireChance = 0.004 + Math.random() * 0.004;
  }
  update() {
    this.y += this.speed;
    if (Math.random() < this.fireChance) {
      enemyBullets.push(new Bullet(this.x + this.w / 2 - 2, this.y + this.h, 4, '#f66'));
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
    ctx.fillStyle = '#f55';
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.lineTo(12, -16);
    ctx.lineTo(0, -8);
    ctx.lineTo(-12, -16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#a33';
    ctx.fillRect(-16, -6, 32, 6);
    ctx.restore();
  }
}

class Star {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.speed = 0.5 + Math.random() * 2;
    this.size = Math.random() * 2 + 0.5;
  }
  update() {
    this.y += this.speed;
    if (this.y > H) { this.y = 0; this.x = Math.random() * W; }
  }
  draw() {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

let player, bullets, enemyBullets, enemies, stars, score, lives, spawnTimer, running, animId;

function init() {
  player = new Player();
  bullets = [];
  enemyBullets = [];
  enemies = [];
  stars = Array.from({ length: 80 }, () => new Star());
  score = 0;
  lives = MAX_LIVES;
  spawnTimer = 0;
  running = true;
  scoreEl.textContent = score;
  renderLives();
}

function endGame(win) {
  running = false;
  cancelAnimationFrame(animId);
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="subtitle">${win ? 'Mission Complete' : 'Aircraft Down'}</div>
    <h1>${win ? 'YOU WIN!' : 'GAME OVER'}</h1>
    <div class="score-line">Final Score: ${score}</div>
    <p class="hint">${win ? 'Outstanding flying, ace.' : 'Better luck next time, pilot.'}</p>
    <button id="startBtn">Play Again</button>
  `;
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function loop() {
  if (!running) return;
  ctx.clearRect(0, 0, W, H);

  stars.forEach(s => { s.update(); s.draw(); });

  player.update();
  player.draw();

  spawnTimer++;
  if (spawnTimer > 50) {
    enemies.push(new Enemy());
    spawnTimer = 0;
  }

  bullets.forEach(b => { b.update(); b.draw(); });
  bullets = bullets.filter(b => b.y > -20);

  enemyBullets.forEach(b => { b.update(); b.draw(); });
  enemyBullets = enemyBullets.filter(b => b.y < H + 20);

  enemies.forEach(e => { e.update(); e.draw(); });
  enemies = enemies.filter(e => e.y < H + 50);

  // bullet vs enemy
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const e = enemies[ei];
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      if (rectsCollide(e, b)) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
        score += 10;
        scoreEl.textContent = score;
        break;
      }
    }
  }

  // enemy bullet vs player
  for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
    if (rectsCollide(enemyBullets[bi], player)) {
      enemyBullets.splice(bi, 1);
      hitPlayer();
    }
  }

  // enemy vs player collision
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    if (rectsCollide(enemies[ei], player)) {
      enemies.splice(ei, 1);
      hitPlayer();
    }
  }

  if (running) animId = requestAnimationFrame(loop);
}

function hitPlayer() {
  lives--;
  renderLives();
  flashHit();
  if (lives <= 0) endGame(false);
}

function startGame() {
  init();
  overlay.classList.add('hidden');
  animId = requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
