<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sky Fighter</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0a1a2f;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace; overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    background: linear-gradient(#0a1a3f, #1c3d6b);
    display: block;
    border: 2px solid #3af;
    box-shadow: 0 0 30px rgba(51,170,255,0.4);
  }
  #hud {
    position: absolute; top: 10px; left: 10px; color: #cff;
    font-size: 18px; text-shadow: 0 0 6px #08f; pointer-events: none;
  }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; background: rgba(0,10,30,0.75);
  }
  #overlay h1 { font-size: 40px; margin: 0 0 10px; color: #6cf; text-shadow: 0 0 10px #08f; }
  #overlay p { margin: 4px 0; }
  #overlay button {
    margin-top: 16px; padding: 10px 24px; font-size: 18px; cursor: pointer;
    background: #1c3d6b; color: #cff; border: 2px solid #3af; border-radius: 6px;
  }
  #overlay button:hover { background: #2a5488; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
  <div id="overlay">
    <h1>SKY FIGHTER</h1>
    <p>Arrow keys / WASD to move, Space to shoot</p>
    <p>Destroy enemy planes. Avoid collisions.</p>
    <button id="startBtn">Start Game</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

class Player {
  constructor() {
    this.w = 40; this.h = 40;
    this.x = W / 2 - this.w / 2; this.y = H - 80;
    this.speed = 5;
    this.cooldown = 0;
  }
  update() {
    if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
    if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
    if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
    if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;
    this.x = Math.max(0, Math.min(W - this.w, this.x));
    this.y = Math.max(0, Math.min(H - this.h, this.y));
    if (this.cooldown > 0) this.cooldown--;
    if (keys['Space'] && this.cooldown === 0) {
      bullets.push(new Bullet(this.x + this.w / 2 - 2, this.y, -8, '#6cf'));
      this.cooldown = 10;
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
    ctx.fillStyle = '#6cf';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(14, 18);
    ctx.lineTo(0, 10);
    ctx.lineTo(-14, 18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#39c';
    ctx.fillRect(-20, 2, 40, 6);
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, vy, color) {
    this.x = x; this.y = y; this.w = 4; this.h = 10; this.vy = vy; this.color = color;
  }
  update() { this.y += this.vy; }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
  }
}

class Enemy {
  constructor() {
    this.w = 34; this.h = 34;
    this.x = Math.random() * (W - this.w);
    this.y = -this.h;
    this.speed = 1.5 + Math.random() * 2;
    this.fireChance = 0.004 + Math.random() * 0.004;
  }
  update() {
    this.y += this.speed;
    if (Math.random() < this.fireChance) {
      enemyBullets.push(new Bullet(this.x + this.w / 2 - 2, this.y + this.h, 4, '#f66'));
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
    ctx.fillStyle = '#f55';
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.lineTo(12, -16);
    ctx.lineTo(0, -8);
    ctx.lineTo(-12, -16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#a33';
    ctx.fillRect(-16, -6, 32, 6);
    ctx.restore();
  }
}

class Star {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.speed = 0.5 + Math.random() * 2;
    this.size = Math.random() * 2 + 0.5;
  }
  update() {
    this.y += this.speed;
    if (this.y > H) { this.y = 0; this.x = Math.random() * W; }
  }
  draw() {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

let player, bullets, enemyBullets, enemies, stars, score, lives, spawnTimer, running, animId;

function init() {
  player = new Player();
  bullets = [];
  enemyBullets = [];
  enemies = [];
  stars = Array.from({ length: 80 }, () => new Star());
  score = 0;
  lives = 3;
  spawnTimer = 0;
  running = true;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
}

function endGame(win) {
  running = false;
  cancelAnimationFrame(animId);
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>${win ? 'YOU WIN!' : 'GAME OVER'}</h1>
    <p>Final Score: ${score}</p>
    <button id="startBtn">Play Again</button>
  `;
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function loop() {
  if (!running) return;
  ctx.clearRect(0, 0, W, H);

  stars.forEach(s => { s.update(); s.draw(); });

  player.update();
  player.draw();

  spawnTimer++;
  if (spawnTimer > 50) {
    enemies.push(new Enemy());
    spawnTimer = 0;
  }

  bullets.forEach(b => { b.update(); b.draw(); });
  bullets = bullets.filter(b => b.y > -20);

  enemyBullets.forEach(b => { b.update(); b.draw(); });
  enemyBullets = enemyBullets.filter(b => b.y < H + 20);

  enemies.forEach(e => { e.update(); e.draw(); });
  enemies = enemies.filter(e => e.y < H + 50);

  // bullet vs enemy
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    const e = enemies[ei];
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      if (rectsCollide(e, b)) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
        score += 10;
        scoreEl.textContent = score;
        break;
      }
    }
  }

  // enemy bullet vs player
  for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
    if (rectsCollide(enemyBullets[bi], player)) {
      enemyBullets.splice(bi, 1);
      hitPlayer();
    }
  }

  // enemy vs player collision
  for (let ei = enemies.length - 1; ei >= 0; ei--) {
    if (rectsCollide(enemies[ei], player)) {
      enemies.splice(ei, 1);
      hitPlayer();
    }
  }

  if (running) animId = requestAnimationFrame(loop);
}

function hitPlayer() {
  lives--;
  livesEl.textContent = lives;
  if (lives <= 0) endGame(false);
}

function startGame() {
  init();
  overlay.classList.add('hidden');
  animId = requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
